name: Create PR from 17.0 to 17.0-dev After Merge

on:
  push:
    branches:
      - 17.0  # This runs when a PR is merged into 17.0

jobs:
  sync-to-dev:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: sudo apt-get install -y gh

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Check if PR from 17.0 to 17.0-dev exists
        id: check_pr
        run: |
          pr_url=$(gh pr list --base 17.0-dev --head 17.0 --json url --jq '.[0].url')
          echo "pr_url=$pr_url" >> $GITHUB_OUTPUT

      - name: Create PR if not exists
        if: steps.check_pr.outputs.pr_url == ''
        run: |
          gh pr create \
            --base 17.0-dev \
            --head 17.0 \
            --title "Sync 17.0 to 17.0-dev" \
            --body "Auto-generated PR to sync latest changes from 17.0 into 17.0-dev."

      - name: Comment on existing PR if already open
        if: steps.check_pr.outputs.pr_url != ''
        run: |
          gh pr comment "${{ steps.check_pr.outputs.pr_url }}" \
            --body "New changes were merged into 17.0 — this PR remains up-to-date."
