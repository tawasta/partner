name: Open PR from feature branch to 17.0-dev

on:
  pull_request:
    branches:
      - 17.0
    types: [opened, reopened, synchronize]

jobs:
  open-pr-to-dev:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: sudo apt-get install -y gh

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Create PR from feature branch to 17.0-dev
        run: |
          SOURCE_BRANCH="${{ github.event.pull_request.head.ref }}"
          echo "Creating/updating PR from $SOURCE_BRANCH to 17.0-dev"

          # Check if a PR already exists
          pr_url=$(gh pr list --base 17.0-dev --head "$SOURCE_BRANCH" --json url --jq '.[0].url')

          if [ -z "$pr_url" ]; then
            gh pr create \
              --base 17.0-dev \
              --head "$SOURCE_BRANCH" \
              --title "Sync $SOURCE_BRANCH to 17.0-dev" \
              --body "Auto-generated PR to keep 17.0-dev updated with changes from $SOURCE_BRANCH."
          else
            echo "PR already exists: $pr_url"
            gh pr comment "$pr_url" \
              --body "🔄 Sync PR updated — new changes from $SOURCE_BRANCH."
          fi
